<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Eastern Market Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2b1c14;
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    touch-action: none;
  }
  #root {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 900px;
    background: #5C94FC;
    overflow: hidden;
    box-shadow: 0 0 0 4px #1b120c, 0 0 40px rgba(0,0,0,0.6);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: linear-gradient(#3a2418ee, #3a241800);
    pointer-events: none;
  }
  .hud-pill {
    background: #F4E9D8;
    border: 3px solid #A63A2E;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 10px;
    color: #3a2418;
    pointer-events: auto;
    box-shadow: 2px 2px 0 #00000055;
  }
  .hud-pill.money { color: #1a6b2c; }
  .list-btn {
    cursor: pointer;
  }
  .dpad {
    position: absolute;
    bottom: 18px;
    left: 14px;
    width: 132px;
    height: 132px;
    pointer-events: auto;
  }
  .dbtn {
    position: absolute;
    width: 44px;
    height: 44px;
    background: #F4E9D8;
    border: 3px solid #1b120c;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #1b120c;
    opacity: 0.88;
    box-shadow: 2px 2px 0 #00000066;
  }
  .dbtn:active, .dbtn.active { background: #A63A2E; color: #F4E9D8; }
  .dbtn.up { top: 0; left: 44px; }
  .dbtn.down { top: 88px; left: 44px; }
  .dbtn.left { top: 44px; left: 0; }
  .dbtn.right { top: 44px; left: 88px; }

  .modal {
    position: absolute;
    inset: 0;
    background: rgba(20,12,8,0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }
  .card {
    background: #F4E9D8;
    border: 4px solid #A63A2E;
    border-radius: 10px;
    padding: 18px 16px;
    width: 100%;
    max-width: 320px;
    max-height: 80%;
    overflow-y: auto;
    color: #3a2418;
    box-shadow: 6px 6px 0 #00000066;
  }
  .card h2 {
    font-size: 13px;
    margin: 0 0 12px 0;
    color: #A63A2E;
    text-align: center;
    line-height: 1.6;
  }
  .item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 8px;
    padding: 7px 4px;
    border-bottom: 2px dashed #c9b899;
    line-height: 1.5;
  }
  .item-row.done { color: #1a6b2c; }
  .item-row .chk {
    width: 16px; height: 16px;
    border: 2px solid #3a2418;
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
    background: white;
  }
  .item-row.done .chk { background: #58c86a; }
  .swatch {
    width: 12px; height: 12px;
    border: 2px solid #1b120c;
    flex-shrink: 0;
  }
  .price {
    margin-left: auto;
    color: #A63A2E;
    font-weight: bold;
    flex-shrink: 0;
  }
  .item-row.done .price { color: #1a6b2c; }
  .closebtn, .bigbtn {
    display: block;
    margin: 14px auto 2px auto;
    background: #A63A2E;
    color: #F4E9D8;
    border: 3px solid #1b120c;
    border-radius: 6px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 10px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #00000066;
    width: 100%;
  }
  .closebtn {
    background: #F4E9D8;
    color: #A63A2E;
  }
  .toast {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    background: #F4E9D8;
    border: 3px solid #A63A2E;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 10px;
    color: #3a2418;
    pointer-events: none;
    z-index: 15;
    white-space: nowrap;
    box-shadow: 3px 3px 0 #00000066;
  }
  .toast.bad { border-color: #b02a2a; color: #b02a2a; }
  .flash {
    position: absolute;
    inset: 0;
    background: #b02a2a;
    pointer-events: none;
    z-index: 14;
  }
  .center-hint {
    position: absolute;
    top: 46px;
    left: 0; right: 0;
    text-align: center;
    font-size: 7px;
    color: #ffffffcc;
    text-shadow: 1.5px 1.5px 0 #00000088;
    pointer-events: none;
  }

  .builder {
    position: absolute;
    inset: 0;
    background: #F4E9D8;
    display: flex;
    flex-direction: column;
  }
  .builder-header {
    background: #A63A2E;
    color: #F4E9D8;
    padding: 16px 14px 12px;
    flex-shrink: 0;
    box-shadow: 0 3px 0 #1b120c;
  }
  .builder-header h1 {
    font-size: 13px;
    margin: 0 0 8px 0;
    line-height: 1.5;
    text-align: center;
  }
  .builder-sub {
    font-size: 8px;
    text-align: center;
    color: #F4E9D8cc;
    margin-bottom: 10px;
  }
  .builder-blurb {
    font-size: 7px;
    text-align: center;
    line-height: 1.8;
    color: #F4E9D8;
    background: #00000022;
    border-radius: 5px;
    padding: 8px 6px;
    margin-bottom: 10px;
  }
  .avatar-picker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .avatar-label {
    font-size: 7px;
    color: #F4E9D8;
    margin-right: 2px;
  }
  .avatar-btn {
    width: 30px;
    height: 30px;
    font-size: 16px;
    line-height: 1;
    background: #F4E9D8;
    border: 2px solid #1b120c;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .avatar-btn.selected {
    border-color: #D8B44A;
    box-shadow: 0 0 0 2px #D8B44A;
  }
  .copy-msg {
    font-size: 7.5px;
    text-align: center;
    color: #F4E9D8;
    background: #2fae4a;
    border: 2px solid #1b120c;
    border-radius: 5px;
    padding: 5px;
    margin-top: 6px;
  }
  .quick-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .quick-actions button {
    font-family: inherit;
    font-size: 7px;
    background: #F4E9D8;
    color: #A63A2E;
    border: 2px solid #1b120c;
    border-radius: 5px;
    padding: 6px 8px;
  }
  .builder-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px 90px;
    -webkit-overflow-scrolling: touch;
  }
  .cat-label {
    font-size: 8px;
    color: #A63A2E;
    margin: 14px 0 4px;
    border-bottom: 2px solid #A63A2E;
    padding-bottom: 3px;
  }
  .vendor-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 7.5px;
    color: #3a2418;
    padding: 7px 4px;
    border-bottom: 1px dashed #d8c9a3;
    line-height: 1.5;
  }
  .vendor-row.checked { background: #ffffff80; }
  .vendor-row input { width: 15px; height: 15px; flex-shrink: 0; }
  .vswatch {
    width: 11px; height: 11px;
    border: 2px solid #1b120c;
    flex-shrink: 0;
  }
  .vtext { flex: 1; }
  .vvendor { opacity: 0.65; }
  .vprice { color: #A63A2E; font-weight: bold; flex-shrink: 0; }
  .start-btn {
    position: absolute;
    left: 12px; right: 12px; bottom: 14px;
    margin: 0;
  }
  .start-btn:disabled {
    background: #a89f8c;
    color: #F4E9D8;
  }
</style>
</head>

function getSidewalkPattern(ctx) {
  if (_sidewalkPattern) return _sidewalkPattern;
  const bw = 18, bh = 9, gap = 1.4;
  const tile = document.createElement("canvas");
  tile.width = bw * 2;
  tile.height = bh * 2;
  const tctx = tile.getContext("2d");
  const mortar = "#C7B79C";
  const shadeA = "#C48858";
  const shadeB = "#BE7F4E";
  tctx.fillStyle = mortar;
  tctx.fillRect(0, 0, tile.width, tile.height);
  function brick(px, py, color) {
    tctx.fillStyle = color;
    tctx.fillRect(px + gap / 2, py + gap / 2, bw - gap, bh - gap);
  }
  brick(0, 0, shadeA);
  brick(bw, 0, shadeB);
  brick(-bw / 2, bh, shadeB);
  brick(bw / 2, bh, shadeA);
  brick(bw + bw / 2, bh, shadeA);
  _sidewalkPattern = ctx.createPattern(tile, "repeat");
  return _sidewalkPattern;
}

const CLASSIC_IDS = ["candle14", "baguette", "coffee", "soap", "kimchi", "bento", "pie", "tomatoes", "honey", "lettuce", "baklava", "board", "chai", "plant"];
const AVATARS = ["🧑\u200D🛒", "🧑🏻\u200D🛒", "🧑🏼\u200D🛒", "🧑🏽\u200D🛒", "🧑🏾\u200D🛒", "🧑🏿\u200D🛒"];
function computeBarrierPos(b, t) {
  if (b.type === "cart") {
    const x = b.midX + b.amp * Math.sin(t * b.speed + b.phase);
    return {
      x: x - b.w / 2,
      y: b.laneY
    };
  } else {
    const y = b.midY + b.amp * Math.sin(t * b.speed + b.phase);
    return {
      x: b.laneX,
      y: y - b.h / 2
    };
  }
}
function buildGame(selectedIds) {
  const chosen = MASTER_VENDORS.filter(v => selectedIds.includes(v.id));
  const items = chosen.map((v, i) => ({
    ...v,
    x: LANE_X[i % 3],
    y: ROW_START_Y + i * ROW_DY,
    w: STALL_W,
    h: STALL_H
  }));
  const barriers = items.slice(0, -1).map((it, i) => {
    const laneY = it.y + ROW_DY / 2 + 5;
    const pigeon = i % 3 === 2;
    if (pigeon) {
      return {
        type: "pigeon",
        laneX: i % 2 === 0 ? 168 : 306,
        midY: laneY,
        amp: 52,
        speed: 1.55,
        phase: i * 0.9,
        w: 30,
        h: 26
      };
    }
    return {
      type: "cart",
      laneY,
      midX: (MIN_X + MAX_X + PLAYER_W) / 2,
      amp: 94,
      speed: 1.4,
      phase: i * 0.75,
      w: 50,
      h: 34
    };
  });
  const worldH = ROW_START_Y + items.length * ROW_DY + 280;
  const total = items.reduce((s, it) => s + it.price, 0);
  const startBudget = Math.max(40, Math.round(total * 1.3 / 5) * 5);
  return {
    items,
    barriers,
    worldH,
    startBudget
  };
}

function drawBrickFill(ctx, x, y, w, h, brickColor, mortarColor) {
  ctx.fillStyle = brickColor;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = mortarColor;
