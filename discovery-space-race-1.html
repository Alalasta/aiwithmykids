<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Discovery</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #02020a;
    font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #root {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }
  canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; }
  .orb { font-family: 'Orbitron', 'Segoe UI', sans-serif; }
  button { cursor: pointer; }
  ::selection { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  (function () {
    function setViewportHeight() {
      var root = document.getElementById('root');
      if (root) root.style.height = window.innerHeight + 'px';
    }
    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);
  })();
</script>

/* ---------------------------------- CONSTANTS ---------------------------------- */
const BASE_SPEED = 320;
const MAX_SPEED = 760;
const MIN_SPEED = 140;

/* ---------------------------------- DRAW HELPERS ---------------------------------- */
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

  ctx.save();

  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';

  ctx.arc(-r * 0.2, -r * 0.1, r * 0.22, 0, Math.PI * 2);

  ctx.beginPath();
  ctx.arc(r * 0.3, r * 0.2, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.arc(-r * 0.35, -r * 0.4, r * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

  ctx.moveTo(-r * 0.9, -r * 0.1);
  ctx.lineTo(-r * 0.3, -r * 0.9);
  ctx.lineTo(r * 0.5, -r * 0.7);
  ctx.lineTo(r * 0.9, r * 0.1);

  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';

  ctx.restore();
}

  ctx.ellipse(0, r * 0.6, r * 0.5, r * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#6b6258';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  for (const [dx, dy, cr] of [[-0.2, -0.2, 0.22], [0.3, 0.1, 0.16], [-0.1, 0.35, 0.14]]) {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.arc(r * dx, r * dy, r * cr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
const METEOR_DRAWERS = [drawMeteorA, drawMeteorB, drawMeteorC];

/* ---- energy booster ---- */
function drawBooster(ctx, x, y, size, pulse) {
  ctx.save();
  ctx.translate(x, y);
  const s = size * (1 + Math.sin(pulse) * 0.12);
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.6);
  grad.addColorStop(0, 'rgba(120,200,255,0.85)');
  grad.addColorStop(0.5, 'rgba(80,160,255,0.4)');
  grad.addColorStop(1, 'rgba(80,160,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, s * 1.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.rotate(pulse * 0.6);
  ctx.strokeStyle = '#bfe8ff';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.rotate(i / 3 * Math.PI * 2);
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.7, -0.5, 0.5);
    ctx.stroke();
    ctx.restore();
  }
  ctx.rotate(-pulse * 0.6);
  ctx.fillStyle = '#eaf7ff';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.55);
  ctx.lineTo(s * 0.16, -s * 0.05);
  ctx.lineTo(s * 0.42, -s * 0.05);
  ctx.lineTo(0, s * 0.55);
  ctx.lineTo(-s * 0.1, s * 0.05);
  ctx.lineTo(-s * 0.38, s * 0.05);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ---- background: stars + planets ---- */
function hslStr(h, s, l) {
  return `hsl(${h % 360}, ${s}%, ${l}%)`;
}
function drawPlanet(ctx, p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.tilt);
  if (p.hasRing) {
    ctx.save();
    ctx.rotate(p.ringAngle);
    ctx.strokeStyle = hslStr(p.hue, 25, 72) + 'cc';
    ctx.lineWidth = p.r * 0.1;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 1.8, p.r * 0.45, 0, 0, Math.PI, true);
    ctx.stroke();
    ctx.restore();
  }

  // base sphere shading (lit upper-left, dark lower-right terminator)
  const grad = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.05, 0, 0, p.r * 1.05);
  grad.addColorStop(0, hslStr(p.hue, p.sat, Math.min(88, p.light + 22)));
  grad.addColorStop(0.55, hslStr(p.hue, p.sat, p.light));
  grad.addColorStop(1, hslStr(p.hue, p.sat, Math.max(8, p.light - 30)));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, Math.PI * 2);
  ctx.clip();
  if (p.kind === 'gas') {
    // horizontal wavy bands, alternating lightness
    for (let i = 0; i < p.bandCount; i++) {
      const by = -p.r + i / p.bandCount * p.r * 2;
      const bh = p.r * 2 / p.bandCount;
      const shade = i % 2 === 0 ? p.light + 8 : p.light - 10;
      ctx.fillStyle = hslStr(p.hue + i % 3 * 6 - 6, p.sat * 0.8, Math.max(15, Math.min(85, shade)));
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.ellipse(0, by + bh / 2, p.r, bh / 2 + 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // a swirling storm spot
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = hslStr(p.hue + 30, p.sat, Math.max(20, p.light - 15));
    ctx.beginPath();
    ctx.ellipse(p.r * 0.2, p.r * 0.1, p.r * 0.28, p.r * 0.16, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    // rocky: craters, darker mottled patches
    p.craters.forEach(c => {
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = hslStr(p.hue, p.sat, Math.max(10, p.light - 25));
      ctx.beginPath();
      ctx.arc(c.x * p.r, c.y * p.r, c.r * p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = hslStr(p.hue, p.sat, Math.min(90, p.light + 18));
      ctx.beginPath();
      ctx.arc(c.x * p.r - c.r * p.r * 0.25, c.y * p.r - c.r * p.r * 0.25, c.r * p.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // terminator shadow (unlit side)
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.arc(p.r * 0.3, p.r * 0.25, p.r * 0.95, Math.PI * 0.85, Math.PI * 1.65);
  ctx.fill();
  ctx.restore();

  // thin atmosphere rim glow
  ctx.strokeStyle = hslStr(p.hue + 15, Math.min(100, p.sat + 10), 75) + '55';
  ctx.lineWidth = p.r * 0.06;
  ctx.beginPath();
  ctx.arc(0, 0, p.r * 0.98, 0, Math.PI * 2);
  ctx.stroke();
  if (p.hasRing) {
    ctx.save();
    ctx.rotate(p.ringAngle);
    ctx.strokeStyle = hslStr(p.hue, 25, 82) + 'ee';
    ctx.lineWidth = p.r * 0.1;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 1.8, p.r * 0.45, 0, Math.PI, Math.PI * 2, true);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function makePlanet(x, r) {
  const kind = Math.random() < 0.45 ? 'gas' : 'rocky';
  const craters = [];
  if (kind === 'rocky') {
    const count = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      craters.push({
        x: (Math.random() - 0.5) * 1.3,
        y: (Math.random() - 0.5) * 1.3,
        r: 0.12 + Math.random() * 0.16
      });
    }
  }
  return {
    x,
    y: -150,
    r,
    speed: 0.3 + Math.random() * 0.2,
    hue: Math.floor(Math.random() * 360),
    sat: 30 + Math.random() * 45,
    light: 38 + Math.random() * 22,
    kind,
    bandCount: 4 + Math.floor(Math.random() * 4),
    craters,
    hasRing: Math.random() < 0.3,
    ringAngle: (Math.random() - 0.5) * 0.9,
    tilt: (Math.random() - 0.5) * 0.5
  };
}

/* ---------------------------------- GAME COMPONENT ---------------------------------- */
function GameCanvas({
  onFinish,
  onGameOver
}) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const lastTimeRef = useRef(0);
  const keysRef = useRef({
    left: false,
    right: false
  });
  const pointerRef = useRef({
    active: false,
    x: null
  });
  const sizeRef = useRef({
    w: window.innerWidth,
    h: window.innerHeight
  });
  const stateRef = useRef({
    player: {
      x: 0,
      y: 0,
      w: 46,
      h: 74,
      vx: 0
    },
    obstacles: [],
    particles: [],
    thruster: [],
    stars: [],
    planets: [],
    spawnTimer: 0,
    planetTimer: 4,
    currentSpeed: BASE_SPEED,
    distanceTraveled: 0,
    lives: 3,
    invuln: 0,
    shake: 0,
    flashTimer: 0,
    flashColor: null,
    gameOver: false,
    finished: false,
    elapsed: 0
  });
  const [hud, setHud] = useState({
    time: 0,
    lives: 3,
    speed: 0,
    progress: 0
  });
  const hudCounter = useRef(0);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize() {
      const w = window.innerWidth,
        h = window.innerHeight;
      sizeRef.current = {
        w,
        h
      };
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const s = stateRef.current;
      s.player.x = w / 2;
      s.player.y = h - 160;
    }
    resize();
    window.addEventListener('resize', resize);

    // starfield init
    {
      const {
        w,
        h
      } = sizeRef.current;
      const stars = [];
      for (let i = 0; i < 120; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.5 + Math.random() * 1.6,
          depth: 0.3 + Math.random() * 0.8,
          twinkle: Math.random() * 10
        });
      }
      stateRef.current.stars = stars;
    }
    function playBounds() {
      const w = sizeRef.current.w;
      const roadW = Math.min(w * 0.86, 700);
      const left = (w - roadW) / 2;
      return {
        left,
        right: left + roadW,
        width: roadW
      };
    }
    function onKeyDown(e) {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keysRef.current.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keysRef.current.right = true;
    }
    function onKeyUp(e) {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keysRef.current.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keysRef.current.right = false;
    }
    function onPointerDown(e) {
      pointerRef.current.active = true;
      pointerRef.current.x = e.clientX;
    }
    function onPointerMove(e) {
      if (pointerRef.current.active) pointerRef.current.x = e.clientX;
    }
    function onPointerUp() {
      pointerRef.current.active = false;
      pointerRef.current.x = null;
    }
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    function spawnObstacle() {
      const {
        left,
        width
      } = playBounds();
      const isBooster = Math.random() < 0.36;
      const size = isBooster ? 26 : 46 + Math.random() * 14;
      const x = left + 34 + Math.random() * (width - 68);
      stateRef.current.obstacles.push({
        type: isBooster ? 'booster' : 'meteor',
        drawer: METEOR_DRAWERS[Math.floor(Math.random() * METEOR_DRAWERS.length)],
        x,
        y: -90,
        w: size,
        h: size,
        pulse: Math.random() * 10
      });
    }
    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        stateRef.current.particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 240,
          vy: (Math.random() - 0.5) * 240 - 60,
          life: 0.5 + Math.random() * 0.4,
          color
        });
      }
    }
    function update(dt) {
      const s = stateRef.current;
      if (s.gameOver || s.finished) return;
      const {
        left,
        right
      } = playBounds();
      const h = sizeRef.current.h;
      const w = sizeRef.current.w;
      s.elapsed += dt;
      s.currentSpeed += (BASE_SPEED - s.currentSpeed) * Math.min(1, dt * 0.5);
      s.currentSpeed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, s.currentSpeed));
      const accel = 1450,
        friction = 2050,
        maxVX = 520;
      if (pointerRef.current.active && pointerRef.current.x !== null) {
        const target = pointerRef.current.x;
        s.player.x += (target - s.player.x) * Math.min(1, dt * 10);
      } else {
        if (keysRef.current.left) s.player.vx -= accel * dt;
        if (keysRef.current.right) s.player.vx += accel * dt;
        if (!keysRef.current.left && !keysRef.current.right) {
          const sign = Math.sign(s.player.vx);
          s.player.vx -= sign * Math.min(Math.abs(s.player.vx), friction * dt);
        }
        s.player.vx = Math.max(-maxVX, Math.min(maxVX, s.player.vx));
        s.player.x += s.player.vx * dt;
      }
      const halfW = s.player.w / 2;
      s.player.x = Math.max(left + halfW, Math.min(right - halfW, s.player.x));

      // thruster particles (continuous, scales with speed)
      const thrustRate = s.currentSpeed / BASE_SPEED;
      if (Math.random() < thrustRate * 0.9) {
        s.thruster.push({
          x: s.player.x + (Math.random() - 0.5) * 10,
          y: s.player.y + s.player.h * 0.42,
          vx: (Math.random() - 0.5) * 30,
          vy: 140 + Math.random() * 80,
          life: 0.35 + Math.random() * 0.2,
          size: 4 + Math.random() * 4
        });
      }
      s.distanceTraveled += s.currentSpeed * dt;
      if (s.distanceTraveled >= TOTAL_DISTANCE) {
        s.distanceTraveled = TOTAL_DISTANCE;
        s.finished = true;
        onFinish(s.elapsed);
      }
      const progress = Math.min(1, s.distanceTraveled / TOTAL_DISTANCE);
      s.spawnTimer -= dt;
      const interval = Math.max(0.55, 1.3 - progress * 0.6);
      if (s.spawnTimer <= 0 && progress < 0.97) {
        spawnObstacle();
        s.spawnTimer = interval;
      }

      // planets drifting through background
      s.planetTimer -= dt;
      if (s.planetTimer <= 0) {
        s.planetTimer = 5 + Math.random() * 5;
        s.planets.push(makePlanet(Math.random() * w, 40 + Math.random() * 60));
      }
      s.planets = s.planets.filter(p => {
        p.y += s.currentSpeed * dt * p.speed;
        return p.y < h + 200;
      });
      s.stars.forEach(st => {
        st.y += s.currentSpeed * dt * st.depth;
        st.twinkle += dt * 3;
        if (st.y > h) {
          st.y = -5;
          st.x = Math.random() * w;
        }
      });
      const invulnActive = s.invuln > 0;
      if (s.invuln > 0) s.invuln -= dt;
      const pRect = {
        x: s.player.x - halfW,
        y: s.player.y - s.player.h / 2,
        w: s.player.w,
        h: s.player.h
      };
      s.obstacles = s.obstacles.filter(o => {
        o.y += s.currentSpeed * dt;
        o.pulse += dt * 6;
        if (o.y > h + 100) return false;
        const oRect = {
          x: o.x - o.w / 2,
          y: o.y - o.h / 2,
          w: o.w,
          h: o.h
        };
        const hit = pRect.x < oRect.x + oRect.w && pRect.x + pRect.w > oRect.x && pRect.y < oRect.y + oRect.h && pRect.y + pRect.h > oRect.y;
        if (hit) {
